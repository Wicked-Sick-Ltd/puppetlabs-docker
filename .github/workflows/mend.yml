name: "mend"

on:
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:

  # mend_ruby reads MEND_API_KEY and MEND_TOKEN from the repository secrets without
  # declaring them under `on.workflow_call.secrets`, and the `secrets` context is not
  # available in `with`, so inheriting is currently the only way to supply them.
  mend:
    uses: "puppetlabs/cat-github-actions/.github/workflows/mend_ruby.yml@main"
    permissions:
      contents: "read"
    secrets: "inherit"
