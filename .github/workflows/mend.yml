name: "mend"

on:
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:

  # mend_ruby reads secrets.MEND_API_KEY and secrets.MEND_TOKEN but declares no
  # `on.workflow_call.secrets`, so naming them here is rejected as undefined. Its
  # api_key/token inputs are not a way out either: `secrets` is not one of the
  # contexts available to `jobs.<id>.with`. Inheriting is the only option until
  # mend_ruby declares those two secrets; revisit then.
  mend:
    uses: "puppetlabs/cat-github-actions/.github/workflows/mend_ruby.yml@main"
    permissions:
      contents: "read"
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: "inherit"
