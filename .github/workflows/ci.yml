name: "ci"

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    
permissions: {}

jobs:
  # No secrets are passed to the called workflows. The optional secrets they look for
  # (PUPPET_FORGE_TOKEN(_PUBLIC), PUPPET_GEM_SOURCE, TWINGATE_PUBLIC_REPO_KEY) only gate
  # puppetcore/Twingate access, which this module does not use: its Gemfile resolves from
  # rubygems.org and metadata.json caps Puppet below 9.
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    permissions:
      contents: "read"
    with:
      runs_on: "ubuntu-24.04"

  # Acceptance needs VM targets: the tests install and run dockerd, which the litmus
  # docker provisioner cannot host. The only VM provisioner in the matrix is
  # provision_service, and matrix_from_metadata_v3 drops it outside the puppetlabs
  # org, so forks are left with no usable provisioner and cannot run these tests.
  Acceptance:
    needs: Spec
    if: "github.repository_owner == 'puppetlabs'"
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    permissions:
      contents: "read"
    with:
      flags: '--provision-prefer provision_service --provision-exclude docker --arch-exclude arm --puppetlabs --nightly'
